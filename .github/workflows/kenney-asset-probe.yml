name: kenney-asset-vendor

on:
  push:
    branches:
      - feature/kenney-character-sprites

permissions:
  contents: write

jobs:
  vendor-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kenney-character-sprites
      - name: Download original CC0 Tiny Dungeon pack
        run: |
          mkdir -p /tmp/kenney
          curl -fL 'https://kenney.nl/media/pages/assets/tiny-dungeon/f8422efb44-1674742415/kenney_tiny-dungeon.zip' -o /tmp/kenney/tiny-dungeon.zip
          unzip -q /tmp/kenney/tiny-dungeon.zip -d /tmp/kenney/extracted
      - name: Vendor selected character and enemy sprites
        run: |
          mkdir -p public/sprites/kenney
          cp /tmp/kenney/extracted/Tiles/tile_0084.png public/sprites/kenney/weaver-arcane.png
          cp /tmp/kenney/extracted/Tiles/tile_0085.png public/sprites/kenney/weaver-fighter.png
          cp /tmp/kenney/extracted/Tiles/tile_0087.png public/sprites/kenney/weaver-delver.png
          cp /tmp/kenney/extracted/Tiles/tile_0088.png public/sprites/kenney/weaver-rover.png
          cp /tmp/kenney/extracted/Tiles/tile_0099.png public/sprites/kenney/weaver-mystic.png
          cp /tmp/kenney/extracted/Tiles/tile_0112.png public/sprites/kenney/weaver-warden.png
          cp /tmp/kenney/extracted/Tiles/tile_0121.png public/sprites/kenney/frayed-wisp.png
          cp /tmp/kenney/extracted/Tiles/tile_0120.png public/sprites/kenney/hollow-stalker.png
          cp /tmp/kenney/extracted/Tiles/tile_0096.png public/sprites/kenney/silkbound-guard.png
          cp /tmp/kenney/extracted/Tiles/tile_0110.png public/sprites/kenney/boss.png
          cp /tmp/kenney/extracted/License.txt public/sprites/kenney/LICENSE.txt
          cat > public/sprites/kenney/README.md <<'EOF'
          # Kenney Tiny Dungeon sprites

          These sprites are selected unchanged from **Kenney Tiny Dungeon 1.0** (16×16 pixel art).

          Source: https://kenney.nl/assets/tiny-dungeon
          License: Creative Commons Zero (CC0 1.0). See `LICENSE.txt`.

          Threadbound mappings:
          - `weaver-*.png`: deterministic player character variants
          - `frayed-wisp.png`: tile 0121
          - `hollow-stalker.png`: tile 0120
          - `silkbound-guard.png`: tile 0096
          - `boss.png`: tile 0110

          The original art is vendored so gameplay never depends on an external image host or API.
          EOF
          cat > public/sprite-catalog.js <<'EOF'
          const WEAVER_SPRITES = Object.freeze([
            '/sprites/kenney/weaver-arcane.png',
            '/sprites/kenney/weaver-fighter.png',
            '/sprites/kenney/weaver-delver.png',
            '/sprites/kenney/weaver-rover.png',
            '/sprites/kenney/weaver-mystic.png',
            '/sprites/kenney/weaver-warden.png',
          ]);

          const ENEMY_SPRITES = Object.freeze({
            'frayed-wisp': '/sprites/kenney/frayed-wisp.png',
            'hollow-stalker': '/sprites/kenney/hollow-stalker.png',
            'silkbound-guard': '/sprites/kenney/silkbound-guard.png',
          });

          function stableIndex(seed, size) {
            const value = String(seed || 'threadbound-weaver');
            let hash = 2166136261;
            for (let index = 0; index < value.length; index += 1) {
              hash ^= value.charCodeAt(index);
              hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0) % size;
          }

          export function weaverSprite(seed) {
            return WEAVER_SPRITES[stableIndex(seed, WEAVER_SPRITES.length)];
          }

          export function enemySprite(enemy = {}) {
            if (enemy.isBoss) return '/sprites/kenney/boss.png';
            return ENEMY_SPRITES[String(enemy.id || '')] || '/sprites/kenney/frayed-wisp.png';
          }
          EOF
      - name: Wire the vendored sprite catalog into presentation code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, required=True):
              file = Path(path)
              text = file.read_text()
              if required and old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new))

          def prepend_import(path):
              file = Path(path)
              text = file.read_text()
              statement = "import { enemySprite, weaverSprite } from './sprite-catalog.js';\n\n"
              if not text.startswith(statement):
                  file.write_text(statement + text)

          prepend_import('public/game.js')
          prepend_import('public/adventure-stream.js')
          prepend_import('public/adventure-meta-commands.js')

          replace(
              'public/game.js',
              "    const avatar = document.createElement('span');\n    avatar.className = 'member-avatar';\n    avatar.textContent = member.displayName.slice(0, 1).toUpperCase();",
              "    const avatar = document.createElement('img');\n    avatar.className = 'member-avatar';\n    avatar.src = weaverSprite(member.playerId);\n    avatar.alt = '';\n    avatar.dataset.testid = 'party-member-sprite';",
          )
          replace(
              'public/game.js',
              "    enemy.innerHTML = `<img src=\"${run.enemy.isBoss ? '/sprites/boss.svg' : `/sprites/${run.enemy.id}.svg`}\" alt=\"\" class=\"thread-sprite\"><div class=\"enemy-body\"><div class=\"enemy-name\"><span></span><span>${run.enemy.hp}/${run.enemy.maxHp} HP</span></div>${progressBar(run.enemy.hp, run.enemy.maxHp)}</div>`;",
              "    enemy.innerHTML = `<img src=\"${enemySprite(run.enemy)}\" alt=\"\" class=\"thread-sprite\"><div class=\"enemy-body\"><div class=\"enemy-name\"><span></span><span>${run.enemy.hp}/${run.enemy.maxHp} HP</span></div>${progressBar(run.enemy.hp, run.enemy.maxHp)}</div>`;",
          )
          replace(
              'public/game.js',
              '<img src="/sprites/weaver.svg" alt="" class="thread-sprite">',
              '<img src="${weaverSprite(data.character.id)}" alt="" class="thread-sprite" data-testid="weaver-character-sprite">',
          )

          replace(
              'public/adventure-stream.js',
              "  function spriteForEnemy(enemy) {\n    if (!enemy) return '/sprites/frayed-wisp.svg';\n    return enemy.isBoss ? '/sprites/boss.svg' : `/sprites/${enemy.id}.svg`;\n  }",
              "  function spriteForEnemy(enemy) {\n    return enemySprite(enemy);\n  }",
          )
          replace(
              'public/adventure-stream.js',
              '<img src="/sprites/weaver.svg" alt="" class="thread-sprite">',
              '<img src="${weaverSprite(dashboard.character.id)}" alt="" class="thread-sprite" data-testid="stream-weaver-sprite">',
          )

          replace(
              'public/adventure-meta-commands.js',
              "  function knownEnemySprite(metadata = {}) {\n    if (metadata.defeatedBoss || metadata.enemy?.isBoss) return '/sprites/boss.svg';\n    const enemyId = String(metadata.enemyId || metadata.defeatedEnemyId || '');\n    if (['frayed-wisp', 'hollow-stalker', 'silkbound-guard'].includes(enemyId)) return `/sprites/${enemyId}.svg`;\n    return '/sprites/frayed-wisp.svg';\n  }",
              "  function knownEnemySprite(metadata = {}) {\n    return enemySprite({\n      id: String(metadata.enemyId || metadata.defeatedEnemyId || ''),\n      isBoss: Boolean(metadata.defeatedBoss || metadata.enemy?.isBoss),\n    });\n  }",
          )
          replace(
              'public/adventure-meta-commands.js',
              "function healthUnit({ label, name, hp, maxHp, enemy = false, testId = null, sprite = '/sprites/weaver.svg' })",
              "function healthUnit({ label, name, hp, maxHp, enemy = false, testId = null, sprite = '/sprites/kenney/weaver-arcane.png' })",
          )
          replace(
              'public/adventure-meta-commands.js',
              "      testId: 'stream-actor-hp',\n    });",
              "      testId: 'stream-actor-hp',\n      sprite: weaverSprite(metadata.playerId || entry.actorId || entry.actorName),\n    });",
          )

          # CSS-only encounter mirrors use the same vendored PNGs.
          replacements = {
              '/sprites/frayed-wisp.svg': '/sprites/kenney/frayed-wisp.png',
              '/sprites/hollow-stalker.svg': '/sprites/kenney/hollow-stalker.png',
              '/sprites/silkbound-guard.svg': '/sprites/kenney/silkbound-guard.png',
              '/sprites/boss.svg': '/sprites/kenney/boss.png',
          }
          css = Path('public/adventure-stream.css')
          css_text = css.read_text()
          for old, new in replacements.items():
              css_text = css_text.replace(old, new)
          css.write_text(css_text)

          # Existing E2E assertions now verify that the real vendored PNG assets render.
          for path in ['test/e2e/adventure-stream.spec.js', 'test/e2e/mobile.spec.js']:
              file = Path(path)
              text = file.read_text()
              text = text.replace('img[src="/sprites/weaver.svg"]', 'img[src^="/sprites/kenney/weaver-"]')
              for old, new in replacements.items():
                  text = text.replace(f'img[src="{old}"]', f'img[src="{new}"]')
              file.write_text(text)
          PY
      - name: Commit vendored art and presentation wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public test
          git commit -m 'Use Kenney CC0 character sprites'
          git push origin HEAD:feature/kenney-character-sprites
